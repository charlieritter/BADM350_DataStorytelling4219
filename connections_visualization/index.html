<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Network Insights</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="dashboard">
        <header>
            <h1>My Network <span>Insights</span></h1>
            <p>A data-driven deep dive into your professional connections.</p>
        </header>

        <main>
            <!-- Charts Section -->
            <div class="charts-container">
                <div class="chart-card tall" style="margin-bottom: 2rem;">
                    <h3>Industries: Me vs. Network</h3>
                    <p style="font-size:0.85em; color:#94a3b8; margin-top:-10px; margin-bottom:10px; text-align: center;">Outer Ring: Network | Inner Ring: Me</p>
                    <div class="chart-wrapper">
                        <canvas id="rolesChart"></canvas>
                    </div>
                </div>

                <div class="chart-card tall">
                    <h3>Connection Growth Over Time</h3>
                    <div class="chart-wrapper">
                        <canvas id="growthChart"></canvas>
                    </div>
                </div>

                <div class="chart-row">
                    <div class="chart-card half">
                        <h3>Top 10 Companies in My Network</h3>
                        <div class="chart-wrapper">
                            <canvas id="companiesChart"></canvas>
                        </div>
                    </div>
                    
                    <div class="chart-card half">
                        <h3>Skills Overlap with Network Roles</h3>
                        <div class="chart-wrapper">
                            <canvas id="skillsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>


        </main>
    </div>

    <!-- Initialization Scripts -->
    <script src="script.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
